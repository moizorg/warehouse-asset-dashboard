services:
  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      DATABASE_PATH: /app/data/assets.db
      UPLOAD_FOLDER: /app/uploads
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:4173
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:5000
volumes:
  backend-data:
  backend-uploads:
